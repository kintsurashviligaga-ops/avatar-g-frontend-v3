# Video Core v1.0 — real-backend E2E on an ISOLATED, throwaway Supabase (owner decision 2026-10-12 "CI ლოკალური").
#
# Two jobs, both on the runner only, both destroyed with it:
#   billing-pg — the ledger, lease queue, multi-step runs (real ffmpeg) and outbox on a local Postgres 16 + PostgREST
#                (scripts/lease-isolation/run.sh), as on the developer machine.
#   live-e2e   — the Supabase CLI's local stack (Postgres 17, GoTrue, PostgREST, Storage, Kong) with the Test Schema
#                Baseline (e2e/video-core-live/baseline), `next start` of this branch, and Playwright on a desktop and an
#                iPhone-13 viewport (tests/video-core-live): sign-in, uploads, quote, confirm, ffmpeg render, decoded frame
#                counts, cancel/retry, error recovery, idempotency, ledger, RLS and other-user denial.
#
# What it never touches: Production. No GitHub secret is read. Every key in the job is either the local stack's own
# (generated by `supabase start` on this runner, reachable only on its loopback) or made here with `openssl rand`; all
# are masked. A fail-closed guard runs twice (the shell step below and tests/video-core-live/guard.ts) and stops the job
# if any database-pointing variable names the Production project, a hosted *.supabase.co, or a host that is not this
# machine. No AI provider credential exists in the job, so no paid call can happen.
#
# Why the stack is reached as https://supabase.video-core-e2e.test:54443: the app's server-side fetch of user media
# (lib/web/publicFetch.ts) rightly refuses loopback and private addresses, and this job does not weaken it. The reserved
# `.test` name (RFC 6761) maps in /etc/hosts to 1.2.3.4, an address added to this runner's own loopback device, so every
# connection stays on the runner while the production SSRF rule stays exactly as shipped. And the app takes a storage
# URL of ours only over https, as Production serves it (lib/security/callerMedia), so a TLS front
# (e2e/video-core-live/scripts/tls-front.mjs) serves the stack's gateway on :54443 with a certificate from a CA made in
# this job for this run only (its key deleted at once); the app and the tests trust that CA through NODE_EXTRA_CA_CERTS.
name: Video Core E2E (isolated local Supabase)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: video-core-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  billing-pg:
    name: billing on real Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ledger, lease queue, runs (ffmpeg) and outbox on Postgres 16 + PostgREST
        run: |
          ls /usr/lib/postgresql/16/bin/initdb
          PG_BIN=/usr/lib/postgresql/16/bin bash scripts/lease-isolation/run.sh 2>&1 | tee billing-pg.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: video-core-billing-pg
          path: billing-pg.txt
          retention-days: 14

  live-e2e:
    name: live E2E (local Supabase, desktop + phone)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SB_WORKDIR: e2e/video-core-live
      E2E_HOST: supabase.video-core-e2e.test
      E2E_IP: 1.2.3.4
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Map the reserved test host to this runner's loopback
        run: |
          sudo ip addr add "$E2E_IP/32" dev lo
          echo "$E2E_IP $E2E_HOST" | sudo tee -a /etc/hosts >/dev/null
          getent ahosts "$E2E_HOST"

      - name: Start the throwaway Supabase stack
        run: |
          supabase --version
          # The CLI prints the stack's keys at the end of `start`; the log is public, so only a redacted copy is shown.
          if ! supabase start --workdir "$SB_WORKDIR" >sb-start.log 2>&1; then
            sed -E 's/(eyJ|sb_(publishable|secret)_)[A-Za-z0-9._-]+/***/g; s#postgres(ql)?://[^ ]+#postgresql://***#g' sb-start.log
            exit 1
          fi
          sed -E 's/(eyJ|sb_(publishable|secret)_)[A-Za-z0-9._-]+/***/g; s#postgres(ql)?://[^ ]+#postgresql://***#g' sb-start.log | tail -n 30
          docker ps --format '{{.Names}}\t{{.Ports}}'

      - name: Export the stack's own keys (masked) and the app's env
        run: |
          supabase status --workdir "$SB_WORKDIR" -o env >sb-status.env 2>/dev/null
          get() { sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" sb-status.env | head -n1; }
          echo "status keys: $(cut -d= -f1 sb-status.env | tr '\n' ' ')"
          ANON=$(get ANON_KEY); SERVICE=$(get SERVICE_ROLE_KEY); DB=$(get DB_URL); API=$(get API_URL)
          [ -n "$ANON" ] || ANON=$(get PUBLISHABLE_KEY)
          [ -n "$SERVICE" ] || SERVICE=$(get SECRET_KEY)
          if [ -z "$ANON" ] || [ -z "$SERVICE" ] || [ -z "$DB" ]; then echo "::error::supabase status gave no keys"; exit 1; fi
          QUOTE=$(openssl rand -hex 32); CRON=$(openssl rand -hex 32)
          for v in "$ANON" "$SERVICE" "$DB" "$QUOTE" "$CRON"; do echo "::add-mask::$v"; done
          echo "local API_URL host: ${API#*://}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=https://$E2E_HOST:54443"
            echo "SUPABASE_URL=https://$E2E_HOST:54443"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "E2E_DB_URL=$DB"
            echo "AGENT_G_QUOTE_SECRET=$QUOTE"
            echo "CRON_SECRET=$CRON"
            echo "AGENT_G_MEDIA_EXEC=admin"
            echo "VIDEO_CORE_LIVE_E2E=1"
          } >>"$GITHUB_ENV"
          rm -f sb-status.env sb-start.log

      - name: Reach the stack through the test host (forward if Docker bound loopback only)
        run: |
          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$E2E_HOST:54321/auth/v1/health" -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" || true; }
          code=$(probe)
          if [ "$code" != "200" ]; then
            echo "direct: HTTP $code; starting a loopback forwarder $E2E_IP:54321 -> 127.0.0.1:54321"
            nohup node e2e/video-core-live/scripts/forward.mjs "$E2E_IP" 54321 127.0.0.1 54321 >forward.log 2>&1 &
            sleep 2; code=$(probe)
          fi
          echo "auth health via $E2E_HOST: HTTP $code"
          [ "$code" = "200" ]

      - name: Serve the stack over https (a CA made for this run only)
        run: |
          tls="$RUNNER_TEMP/video-core-e2e-tls"
          bash e2e/video-core-live/scripts/make-tls.sh "$E2E_HOST" "$tls"
          nohup node e2e/video-core-live/scripts/tls-front.mjs "$E2E_IP" 54443 "$E2E_IP" 54321 "$tls/leaf.pem" "$tls/leaf.key" >tls-front.log 2>&1 &
          echo "NODE_EXTRA_CA_CERTS=$tls/ca.pem" >>"$GITHUB_ENV"
          code=000
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 --cacert "$tls/ca.pem" "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          cat tls-front.log
          echo "auth health via $NEXT_PUBLIC_SUPABASE_URL (certificate verified): HTTP $code"
          [ "$code" = "200" ]

      - name: Fail-closed guard (never Production, never hosted, only this machine)
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL E2E_DB_URL; do
            val="${!v}"
            case "$val" in
              *zwksnayknzggdcenqqxy*|*supabase.co*|*supabase.com*|*supabase.in*|*supabase.net*|*pooler.supabase*)
                echo "::error::$v points at a hosted Supabase project; refusing"; exit 64 ;;
            esac
          done
          case "$E2E_DB_URL" in *@127.0.0.1:*|*@localhost:*) ;; *) echo "::error::E2E_DB_URL is not on this machine"; exit 64 ;; esac
          addrs=$(getent ahostsv4 "$E2E_HOST" | awk '{print $1}' | sort -u)
          [ "$addrs" = "$E2E_IP" ] || { echo "::error::$E2E_HOST resolves to '$addrs', not $E2E_IP"; exit 64; }
          ip -4 addr show dev lo | grep -q "inet $E2E_IP/32" || { echo "::error::$E2E_IP is not on this runner's loopback"; exit 64; }
          echo "guard: isolated stack only"

      - name: Apply the Test Schema Baseline (and verify RLS, RPC, triggers, storage, billing)
        id: baseline
        run: bash e2e/video-core-live/baseline/apply.sh "$E2E_DB_URL"

      - name: Anon-key exposure check against the local stack
        run: node scripts/check-db-exposure.mjs

      - name: Build this branch against the local stack
        run: npm run build

      - name: Start the app (next start)
        run: |
          mkdir -p test-results/video-core-live
          nohup npx next start -p 3000 >test-results/video-core-live/server.txt 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/en && break; sleep 2; done
          curl -s -o /dev/null -w 'GET /en → HTTP %{http_code}\n' http://localhost:3000/en

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright — real backend, desktop + iPhone 13
        run: npx playwright test -c playwright.video-core-live.config.ts

      # B3: the storyboard revision tables are a PROPOSAL (not in Production). Applied here, after the E2E ran on the
      # Production-shaped baseline, only to prove the DDL, constraints and RLS on Supabase's Postgres.
      - name: B3 proposal check (storyboard revisions) on this throwaway database only
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: |
          mk() {
            curl -sf --cacert "$NODE_EXTRA_CA_CERTS" -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/admin/users" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"vc-b3-$1-$(openssl rand -hex 4)@example.com\",\"password\":\"$(openssl rand -hex 16)\",\"email_confirm\":true}" \
              | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>process.stdout.write(JSON.parse(s).id))'
          }
          OWNER=$(mk owner); OTHER=$(mk other)
          psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -v owner="$OWNER" -v other="$OTHER" -f e2e/video-core-live/proposals/storyboard_revisions_check.sql

      - name: Stack logs on failure (redacted)
        if: ${{ failure() }}
        run: |
          mkdir -p test-results/video-core-live/stack-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep -i supabase); do
            docker logs --tail 400 "$c" 2>&1 | sed -E 's/(eyJ|sb_(publishable|secret)_)[A-Za-z0-9._-]+/***/g' >"test-results/video-core-live/stack-logs/$c.txt" || true
          done
          tail -n 200 test-results/video-core-live/server.txt || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: video-core-live-e2e
          path: |
            test-results/video-core-live/
            !test-results/video-core-live/state/
          retention-days: 14

      - name: Stop the stack
        if: ${{ always() }}
        run: supabase stop --no-backup --workdir "$SB_WORKDIR" || true
