name: E2E - Preview Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preview-e2e:
    runs-on: ubuntu-24.04
    # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to Ubuntu 26.04, where Playwright 1.58 cannot install its browsers.
    # 25, not 15: on a slow runner `playwright install --with-deps` alone takes 10-12 minutes (its apt step), which
    # cancelled this job on #152, #153 and #154 with no test failed. The tests themselves take about 4 minutes.
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-e2e
      # Required so the `next dev` webServer can compile service-role API routes without throwing
      # `Missing SUPABASE_SERVICE_ROLE_KEY` when a request touches one (mirrors ci.yml). Dummy = compile-only.
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run preview-contract E2E (mocked, no provider calls)
        run: npm run test:e2e:preview

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Agent G's door in front of every paid tool (tests/agent-g-gate.spec.ts): talk is answered, a thin prompt is asked
  # about, a real one waits for a priced card. Its own job so the two suites do not share one time budget.
  agent-g-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # the same slow-runner Playwright install as preview-e2e
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-e2e
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Agent G gate E2E (mocked, no provider calls)
        run: npm run test:e2e:agent-g

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-agent-g
          path: playwright-report/
          retention-days: 7
