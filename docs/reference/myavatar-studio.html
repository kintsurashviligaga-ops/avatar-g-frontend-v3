<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;height:100dvh}

function wav(buf){const n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate,data=new Int16Array(n*ch);for(let c=0;c<ch;c++){const inp=buf.getChannelData(c);for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,inp[i]));data[i*ch+c]=s<0?s*0x8000:s*0x7fff;}}const bytes=data.byteLength,out=new ArrayBuffer(44+bytes),v=new DataView(out);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};w(0,'RIFF');v.setUint32(4,36+bytes,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,bytes,true);new Uint8Array(out,44).set(new Uint8Array(data.buffer));return new Blob([out],{type:'audio/wav'});}

function params(){const p=S.p[S.svc];let h=`<div class="sec"><div class="lab">${cost()} კრედიტი</div></div>`;if(S.svc==='video')h+=`<div class="sec"><div class="lab">Aspect</div><div class="g4">${['9:16','1:1','16:9','4:3'].map(a=>`<button class="opt ${p.aspect===a?'on':''}" data-a="set" data-k="aspect" data-v="${a}">${a}</button>`).join('')}</div></div><div class="sec"><div class="lab">ხანგრძლივობა</div>${opts([{v:3,n:'3s'},{v:6,n:'6s'},{v:8,n:'8s'},{v:10,n:'10s'}],p.duration,'duration')}</div><div class="sec"><div class="lab">Target</div>${opts([{v:'480p',n:'480p'},{v:'720p',n:'720p'},{v:'1080p',n:'1080p'}],p.resolution,'resolution')}</div><div class="sec"><div class="lab">კამერა</div>${opts([{v:'none',n:'Static'},{v:'dolly-in',n:'Dolly'},{v:'pan-left',n:'Pan'}],p.camera,'camera')}</div>`;if(S.svc==='image')h+=`<div class="sec"><div class="lab">Aspect</div><div class="g4">${['9:16','3:4','4:5','1:1','16:9','21:9'].map(a=>`<button class="opt ${p.aspect===a?'on':''}" data-a="set" data-k="aspect" data-v="${a}">${a}</button>`).join('')}</div></div><div class="sec"><div class="lab">Resolution</div>${opts([{v:'1K',n:'1K'},{v:'2K',n:'2K'}],p.resolution,'resolution')}</div>`;if(S.svc==='avatar')h+=`<div class="sec"><div class="lab">სტილი</div>${opts([{v:'photo',n:'Photo'},{v:'3d',n:'3D'},{v:'illustrated',n:'Illustrated'}],p.style,'style')}</div><div class="sec"><div class="lab">კადრი</div>${opts([{v:'head',n:'Head'},{v:'bust',n:'Bust'},{v:'full',n:'Full'}],p.shot,'shot')}</div><div class="sec"><div class="lab">ემოცია</div>${opts([{v:'neutral',n:'Neutral'},{v:'happy',n:'Smile'},{v:'serious',n:'Serious'}],p.emotion,'emotion')}</div>`;if(S.svc==='music')h+=`<div class="sec"><div class="lab">ჟანრი</div>${opts([{v:'cinematic',n:'Cinematic'},{v:'lofi',n:'Lo-fi'},{v:'trailer',n:'Trailer'}],p.genre,'genre')}</div><div class="sec"><div class="lab">ხანგრძლივობა</div>${opts([{v:8,n:'8s'},{v:15,n:'15s'},{v:30,n:'30s'}],p.len,'len')}</div>`;if(S.svc==='voice')h+=`<div class="sec"><div class="lab">ენა</div>${opts([{v:'ka',n:'ქართული'},{v:'en',n:'English'}],p.lang,'lang')}</div><div class="sec"><div class="lab">ტონი</div>${opts([{v:'warm',n:'Warm'},{v:'neutral',n:'Neutral'},{v:'fast',n:'Fast'}],p.tone,'tone')}</div>`;sheet('Adjust',h);}
function tools(){const need=S.svc==='video'||S.svc==='image'||S.svc==='avatar';const n=need?(S.refs[S.svc]||[]).length:0,max=S.svc==='video'?7:5,p=S.p[S.svc];let label='Adjust';if(S.svc==='video')label=p.aspect+' · '+p.duration+'s';if(S.svc==='image')label=p.aspect+' · '+p.resolution;if(S.svc==='avatar')label=p.style+' · '+p.shot;if(S.svc==='music')label=p.genre+' · '+p.len+'s';if(S.svc==='voice')label=p.lang.toUpperCase()+' · '+p.tone;document.getElementById('tools').innerHTML=`${need?`<button class="plus" data-a="addref">${I.plus}</button><button class="tool ${n?'on':''}" data-a="refs">${I.image} ${n}/${max}</button>`:''}<button class="tool" data-a="params">${I.sliders} ${label}</button><button class="tool" data-a="nav" data-v="templates">${I.grid} Templates</button><span style="flex:1"></span><button class="tool" data-a="mic">${I.mic}</button>`;const row=document.getElementById('atts');if(!need||!n){row.hidden=true;row.innerHTML='';}else{row.hidden=false;row.innerHTML=S.refs[S.svc].map((r,i)=>`<div class="att"><img src="${U.e(r.thumb||r.url)}"><button class="x" data-a="rmref" data-i="${i}">×</button></div>`).join('');}fitDock();}
function tabs(){document.getElementById('tabs').innerHTML=SVC.map(s=>`<button class="tab ${S.svc===s.id?'on':''}" data-a="svc" data-s="${s.id}">${I[s.id]}<span class="tl">${s.n}</span></button>`).join('');document.getElementById('railSvc').innerHTML=SVC.map(s=>`<button class="ri ${S.svc===s.id?'on':''}" data-a="svc" data-s="${s.id}">${I[s.id]}${s.n}</button>`).join('');document.getElementById('p').placeholder=SVC.find(s=>s.id===S.svc).ph;}
function xmd(){document.getElementById('md').classList.remove('on');document.getElementById('mv').innerHTML='';lock(false);}
function openMd(id){const r=S.results.find(x=>x.id===id);if(!r)return;document.getElementById('mdt').textContent=U.tr(r.prompt,40);const mv=document.getElementById('mv'),mb=document.getElementById('mbar');if(r.type==='video')mv.innerHTML=`<video src="${U.e(r.url)}" poster="${U.e(r.thumb||'')}" controls playsinline></video>`;else if(r.type==='music'||r.type==='voice')mv.innerHTML=`<audio src="${U.e(r.url)}" controls style="width:min(420px,90%)"></audio>`;else if(r.frames)mv.innerHTML=`<img src="${U.e(r.frames[0])}">`;else mv.innerHTML=`<img src="${U.e(r.url)}">`;mb.innerHTML=`${(r.type==='image'||r.type==='avatar')?`<button class="p" data-a="anim" data-id="${r.id}">Animate</button>`:''}<button class="p" data-a="dl" data-id="${r.id}">Download</button>${r.type==='voice'||r.type==='music'?`<button data-a="play" data-id="${r.id}">Play</button>`:''}`;document.getElementById('md').classList.add('on');lock(true);}
function fitDock(){const d=document.querySelector('.dock');if(!d)return;document.documentElement.style.setProperty('--dock',Math.max(148,Math.ceil(d.getBoundingClientRect().height))+'px');}
function vh(){const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;document.documentElement.style.setProperty('--vvh',h+'px');fitDock();}
function closeRail(){document.getElementById('rail').classList.remove('open');if(!document.getElementById('sh').classList.contains('on')&&!document.getElementById('md').classList.contains('on'))document.getElementById('sc').classList.remove('on');}
function nav(){document.querySelectorAll('.ri[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===S.view));}
function ready(){document.getElementById('go').disabled=!document.getElementById('p').value.trim()||S.busy;}
async function go(){if(S.busy)return;const v=document.getElementById('p').value.trim();if(!v){toast('დაწერე ტექსტი');return;}S.busy=true;S.cancel=false;document.getElementById('go').disabled=true;document.getElementById('st').classList.add('on');try{await run(v);}finally{S.busy=false;S.cancel=false;document.getElementById('st').classList.remove('on');ready();}}
function compact(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej();r.onload=ev=>{const i=new Image();i.onload=()=>{const m=720,s=Math.min(1,m/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.max(1,i.width*s);c.height=Math.max(1,i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.74));};i.onerror=()=>rej();i.src=ev.target.result;};r.readAsDataURL(file);});}
async function addFiles(files){if(!(S.svc==='video'||S.svc==='image'||S.svc==='avatar'))return;if(!S.refs[S.svc])S.refs[S.svc]=[];const max=S.svc==='video'?7:5;for(const f of files){if(!String(f.type||'').startsWith('image/'))continue;if(S.refs[S.svc].length>=max){toast('მაქს. ref');break;}try{const url=await compact(f);S.refs[S.svc].push({id:U.id(),url,thumb:url});}catch(e){toast('ფაილი ვერ აიტვირთა');}}tools();save();}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
if(a==='menu'){document.getElementById('rail').classList.toggle('open');document.getElementById('sc').classList.toggle('on',document.getElementById('rail').classList.contains('open')&&innerWidth<=860);return;}
if(a==='home'){S.view='studio';paint();nav();return;}
if(a==='svc'){S.svc=t.dataset.s;S.view='studio';tabs();tools();paint();nav();closeRail();save();return;}
if(a==='nav'){S.view=t.dataset.v;paint();nav();closeRail();return;}
if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',S.theme);save();return;}
if(a==='go'){go();return;}if(a==='quick'){document.getElementById('p').value=t.dataset.p;ready();go();return;}
if(a==='params'){params();return;}
if(a==='refs'){const refs=S.refs[S.svc]||[],max=S.svc==='video'?7:5;let h='<div class="row">';for(let i=0;i<max;i++)h+=refs[i]?`<div class="att" style="width:72px;height:72px"><img src="${U.e(refs[i].url)}"><button class="x" data-a="rmref" data-i="${i}">×</button></div>`:`<button class="opt" data-a="addref">+</button>`;sheet('References',h+'</div>');return;}
if(a==='settings'){sheet('პარამეტრები',`<div class="sec"><div class="lab">თემა</div>${opts([{v:'dark',n:'Dark'},{v:'light',n:'Light'}],S.theme,'__th')}</div>`);return;}
if(a==='credits'){sheet('Credits',`<div style="text-align:center;font-size:36px;font-weight:700;padding:8px 0">${U.n(S.credits)}</div><button class="cta" data-a="plus">+10,000</button>`);return;}
if(a==='xsh'||a==='sc'){if(document.getElementById('md').classList.contains('on')){xmd();return;}xsh();closeRail();return;}
if(a==='xmd'){xmd();return;}if(a==='open'){openMd(t.dataset.id);return;}
if(a==='set'){if(t.dataset.k==='__th'){S.theme=t.dataset.v;document.documentElement.setAttribute('data-theme',S.theme);save();xsh();return;}let v=t.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(v!==''&&!isNaN(+v))v=+v;S.p[S.svc][t.dataset.k]=v;save();params();tools();return;}
if(a==='addref'){document.getElementById('fi').click();return;}if(a==='rmref'){S.refs[S.svc].splice(+t.dataset.i,1);tools();save();return;}
if(a==='tpl'){const tpl=TPL.find(x=>x.id===t.dataset.id);if(!tpl)return;S.svc=tpl.s;if(tpl.aspect)S.p[S.svc].aspect=tpl.aspect;if(tpl.dur)S.p.video.duration=tpl.dur;if(tpl.style)S.p.avatar.style=tpl.style;if(tpl.genre)S.p.music.genre=tpl.genre;if(tpl.lang)S.p.voice.lang=tpl.lang;document.getElementById('p').value=tpl.p;tabs();tools();ready();S.view='studio';paint();toast(tpl.n);return;}
if(a==='tf'){S.tf=t.dataset.s;paint();return;}if(a==='filter'){S.filter=t.dataset.f;paint();return;}
if(a==='del'){const r=S.results.find(x=>x.id===t.dataset.id);if(r&&r.url&&String(r.url).startsWith('blob:'))URL.revokeObjectURL(r.url);await DB.del('blobs',t.dataset.id);S.results=S.results.filter(x=>x.id!==t.dataset.id);save();paint();return;}
if(a==='dl'){const r=S.results.find(x=>x.id===t.dataset.id);if(!r)return;let b=r.blob||await DB.get('blobs',r.id);if(!b&&r.url)try{b=await(await fetch(r.url)).blob();}catch(e){}if(!b){toast('ფაილი არაა');return;}const ael=document.createElement('a');ael.href=URL.createObjectURL(b);ael.download='studio-'+r.type+(r.type==='video'?'.webm':(r.mimeType||'').includes('wav')?'.wav':'.jpg');ael.click();return;}
if(a==='play'){const r=S.results.find(x=>x.id===t.dataset.id);if(!r)return;if(r.type==='voice'&&r.text&&TTS){const u=new SpeechSynthesisUtterance(r.text);u.lang=(r.meta&&r.meta.lang)==='en'?'en-US':'ka-GE';TTS.cancel();TTS.speak(u);}else if(r.url)new Audio(r.url).play();return;}
if(a==='anim'){const r=S.results.find(x=>x.id===t.dataset.id);if(!r)return;S.svc='video';S.refs.video=[{id:U.id(),url:r.thumb||r.url,thumb:r.thumb||r.url}];document.getElementById('p').value=r.prompt||'';tabs();tools();ready();xmd();toast('Animate მზადაა');return;}
if(a==='toproj'){S.wait='proj:'+t.dataset.id;sheet('პროექტი',`<div class="row">${S.projects.map(p=>`<button class="opt" data-a="pickp" data-id="${p.id}">${U.e(p.name)}</button>`).join('')}</div><button class="cta" data-a="newproj">ახალი</button>`);return;}
if(a==='pickp'){const id=(S.wait||'').split(':')[1];const r=S.results.find(x=>x.id===id);if(r)r.projectId=t.dataset.id;save();xsh();paint();toast('დაემატა');return;}
if(a==='newproj'){S.wait=S.wait&&S.wait.startsWith('proj:')?S.wait:'projnew';sheet('ახალი პროექტი','<input class="fld" id="si" placeholder="სახელი"><button class="cta" data-a="ok">OK</button>');setTimeout(()=>{const i=document.getElementById('si');if(i)i.focus();},50);return;}
if(a==='ok'){const v=(document.getElementById('si')||{}).value||'';if(!String(v).trim())return;const p={id:U.id(),name:String(v).trim(),ts:Date.now()};S.projects.push(p);if((S.wait||'').startsWith('proj:')){const r=S.results.find(x=>x.id===S.wait.split(':')[1]);if(r)r.projectId=p.id;}save();xsh();S.view='projects';paint();nav();return;}
if(a==='openp'){S.view='library';const rows=S.results.filter(r=>r.projectId===t.dataset.id);document.getElementById('stage').innerHTML=`<h2 style="margin-bottom:12px">პროექტი</h2>`+(rows.length?`<div class="grid">${rows.map(card).join('')}</div>`:'<div class="empty">ცარიელი</div>');return;}
if(a==='delp'){S.projects=S.projects.filter(p=>p.id!==t.dataset.id);S.results.forEach(r=>{if(r.projectId===t.dataset.id)r.projectId=null;});save();paint();return;}
if(a==='halt'){S.cancel=true;if(TTS)TTS.cancel();return;}if(a==='plus'){S.credits+=10000;creds();save();xsh();return;}
if(a==='clear'){sheet('წაშლა?','<p style="padding:8px 0 12px;color:var(--mu)">ყველა ლოკალური ფაილი წაიშლება.</p><button class="cta" data-a="wipe">წაშლა</button>');return;}
if(a==='wipe'){S.results.forEach(r=>{if(r.url&&String(r.url).startsWith('blob:'))URL.revokeObjectURL(r.url);});await DB.wipe();S.results=[];S.projects=[];S.refs={video:[],image:[],avatar:[]};S.credits=2500;creds();paint();tools();xsh();toast('წაიშალა');return;}
if(a==='mic'){const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){toast('მიკროფონი არაა');return;}const rec=new Rec();rec.lang='ka-GE';rec.onresult=ev=>{document.getElementById('p').value=[].map.call(ev.results,x=>x[0].transcript).join('');ready();};rec.start();return;}
});
document.getElementById('st').onclick=()=>{S.cancel=true;if(TTS)TTS.cancel();};
const pin=document.getElementById('p');
pin.oninput=()=>{pin.style.height='auto';pin.style.height=Math.min(120,pin.scrollHeight)+'px';ready();fitDock();};
pin.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};
document.getElementById('fi').onchange=e=>{addFiles([].slice.call(e.target.files||[]));e.target.value='';};
window.addEventListener('paste',e=>{const files=[].slice.call((e.clipboardData&&e.clipboardData.files)||[]);if(files.length){e.preventDefault();addFiles(files);}});
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add('drop');}));
window.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');addFiles([].slice.call(e.dataTransfer.files||[]));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){xmd();xsh();closeRail();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();go();}});
function menu(){const m=innerWidth<=860;const b=document.getElementById('menubtn'),c=document.getElementById('cx');if(b)b.style.display=m?'':'none';if(c)c.style.display=m?'':'none';if(!m)closeRail();vh();}
if(window.visualViewport){visualViewport.addEventListener('resize',U.db(vh,60));visualViewport.addEventListener('scroll',U.db(vh,60));}
addEventListener('resize',U.db(menu,120));
addEventListener('online',()=>document.getElementById('off').classList.remove('on'));
addEventListener('offline',()=>document.getElementById('off').classList.add('on'));
window.addEventListener('error',e=>{if(e&&e.message)toast(String(e.message).slice(0,90));});
(async function(){try{const snap=await DB.get('kv','snap');if(snap){S.svc=snap.svc||'video';S.theme=snap.theme||'dark';S.credits=Number.isFinite(snap.credits)?snap.credits:2500;if(snap.p)Object.keys(S.p).forEach(k=>{if(snap.p[k])Object.assign(S.p[k],snap.p[k]);});if(snap.refs)Object.assign(S.refs,snap.refs);if(Array.isArray(snap.projects))S.projects=snap.projects;if(Array.isArray(snap.meta)){const out=[];for(const m of snap.meta){const b=await DB.get('blobs',m.id);if(b)out.push(Object.assign({},m,{blob:b,url:URL.createObjectURL(b)}));else if(m.frames||m.type==='preview')out.push(m);}S.results=out;}}}catch(e){}
document.documentElement.setAttribute('data-theme',S.theme);tabs();tools();menu();ready();creds();paint();vh();document.getElementById('off').classList.toggle('on',!navigator.onLine);})();
</script>
